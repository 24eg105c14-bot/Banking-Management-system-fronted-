spring.application.name=banking-management-system
server.port=8080

# Default to H2 for local demo runs. Set DB_URL/DB_USERNAME/DB_PASSWORD to use MySQL instead.
spring.datasource.url=${DB_URL:jdbc:h2:mem:banking_db;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.h2.console.enabled=true
